services:
  signal-studio:
    build: .
    ports:
      - "127.0.0.1:3000:10000"
    env_file: .env.local
    environment:
      DATA_DIR: /data
      PORT: 10000
    volumes:
      - signal_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
volumes:
  signal_data:
