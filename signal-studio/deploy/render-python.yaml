# Separate backend option for a Vercel frontend. Paths assume the ZIP is the repository root.
services:
  - type: web
    name: signal-studio-api
    runtime: python
    plan: starter
    rootDir: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SERVICE_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: DEV_AUTH
        value: "0"
    disk:
      name: signal-python-data
      mountPath: /var/data
      sizeGB: 1
